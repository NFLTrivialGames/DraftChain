<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NFL Draft Chain</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QWSE9N9Q5F"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-QWSE9N9Q5F');
</script>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}

.container {
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card {
    background:rgba(255,255,255,0.08);
    padding:20px;
    border-radius:15px;
    margin:15px 0;
    backdrop-filter: blur(8px);
}

button {
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#00d4ff;
    color:black;
    font-weight:bold;
    cursor:pointer;
    margin:5px;
}

button.active {
    background:#00ff88;
}

input {
    padding:12px;
    width:60%;
    border-radius:8px;
    border:none;
    font-size:16px;
}

#suggestions {
    max-height:150px;
    overflow-y:auto;
    background:#111;
    border-radius:8px;
    margin-top:5px;
}

.suggestion {
    padding:8px;
    cursor:pointer;
}

.suggestion:hover {
    background:#00d4ff;
    color:black;
}

.match { color:#00ff88; }

#timer { font-size:22px; margin-top:10px; }

.toggle {
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
    color:#00d4ff;
}
</style>
</head>

<body>
<div class="container">

<h1>NFL Draft Chain</h1>

<div class="card">
    <strong>Select Mode:</strong><br>
    <button id="rookieBtn" onclick="setMode('rookie')">Rookie Mode (2 Matches)</button>
    <button id="allproBtn" class="active" onclick="setMode('allpro')">All-Pro Mode (3 Matches)</button>
</div>

<div class="card">
    <strong>Build the Longest Draft Chain</strong><br>
    Each new player must match Team • Draft Year • Position • College • Round<br>
    ⏱ 60 seconds per pick • 🚫 No repeats
</div>

<div class="card">
    <div id="startCollege"></div>
    <div id="timer"></div>
</div>

<div class="card">
    <div id="currentPlayer"></div>
</div>

<div class="card">
    <input type="text" id="guessInput" placeholder="Start typing player name...">
    <button onclick="submitGuess()">Submit</button>
    <div id="suggestions"></div>
</div>

<div class="card">
    <div id="feedback"></div>
    <div id="gameOver"></div>
    <div id="streak"></div>
    <button onclick="startGame()">Restart Game</button>
</div>

<div class="card">
    <h3>Best Chains</h3>
    <div id="leaderboard"></div>
</div>

</div>

<script>
let players = [];
let currentPlayer = null;
let streak = 0;
let mode = "allpro";
let matchRequirement = 3;
let firstTurn = true;
let requiredCollege = "";
let usedPlayers = [];
let timerInterval;
let timeLeft = 60;

let bestRookie = localStorage.getItem("bestRookie") || 0;
let bestAllPro = localStorage.getItem("bestAllPro") || 0;

function setMode(selected){
    mode = selected;

    if(mode === "rookie"){
        matchRequirement = 2;
        document.getElementById("rookieBtn").classList.add("active");
        document.getElementById("allproBtn").classList.remove("active");
    } else {
        matchRequirement = 3;
        document.getElementById("allproBtn").classList.add("active");
        document.getElementById("rookieBtn").classList.remove("active");
    }

    startGame();
}

fetch("draftplayers.json")
.then(res => res.json())
.then(data => {
    players = data;
    updateLeaderboard();
    startGame();
});

function startGame(){
    streak = 0;
    firstTurn = true;
    usedPlayers = [];
    clearInterval(timerInterval);
    document.getElementById("gameOver").innerText = "";
    document.getElementById("feedback").innerText = "";
    document.getElementById("currentPlayer").innerText = "";
    document.getElementById("guessInput").value = "";
    document.getElementById("suggestions").innerHTML = "";

    const randomPlayer = players[Math.floor(Math.random()*players.length)];
    requiredCollege = randomPlayer.College;

    document.getElementById("startCollege").innerText =
        "Start College: " + requiredCollege;

    startTimer();
}

function startTimer(){
    timeLeft = 60;
    document.getElementById("timer").innerText = "Time: " + timeLeft;
    clearInterval(timerInterval);

    timerInterval = setInterval(()=>{
        timeLeft--;
        document.getElementById("timer").innerText = "Time: " + timeLeft;
        if(timeLeft <= 0){
            clearInterval(timerInterval);
            endGame("Time’s up!");
        }
    },1000);
}

document.getElementById("guessInput").addEventListener("input", function(){
    const input = this.value.toLowerCase();
    const suggestions = players
        .filter(p => p.Player.toLowerCase().includes(input) && !usedPlayers.includes(p.Player))
        .slice(0,10);

    const suggestionsDiv = document.getElementById("suggestions");
    suggestionsDiv.innerHTML = "";

    suggestions.forEach(p=>{
        const div = document.createElement("div");
        div.className = "suggestion";
        div.innerText = p.Player;
        div.onclick = ()=>{
            document.getElementById("guessInput").value = p.Player;
            suggestionsDiv.innerHTML = "";
        };
        suggestionsDiv.appendChild(div);
    });
});

function submitGuess(){
    const guess = document.getElementById("guessInput").value.trim();
    const guessedPlayer = players.find(p => p.Player.toLowerCase() === guess.toLowerCase());

    if(!guessedPlayer || usedPlayers.includes(guessedPlayer.Player)){
        document.getElementById("feedback").innerText = "Invalid or already used player.";
        return;
    }

    if(firstTurn){
        if(guessedPlayer.College !== requiredCollege){
            endGame("Must match starting college!");
            return;
        }
        currentPlayer = guessedPlayer;
        usedPlayers.push(guessedPlayer.Player);
        firstTurn = false;
        streak++;
        displayCurrent();
        startTimer();
        return;
    }

    let matches = 0;
    let breakdown = [];

    if(guessedPlayer.Team === currentPlayer.Team){ matches++; breakdown.push("Team"); }
    if(guessedPlayer.Year === currentPlayer.Year){ matches++; breakdown.push("Year"); }
    if(guessedPlayer.Pos === currentPlayer.Pos){ matches++; breakdown.push("Position"); }
    if(guessedPlayer.College === currentPlayer.College){ matches++; breakdown.push("College"); }
    if(guessedPlayer.Round === currentPlayer.Round){ matches++; breakdown.push("Round"); }

    if(matches >= matchRequirement){
        currentPlayer = guessedPlayer;
        usedPlayers.push(guessedPlayer.Player);
        streak++;
        document.getElementById("feedback").innerHTML =
            "Correct! Matched: <span class='match'>" + breakdown.join(", ") + "</span>";
        displayCurrent();
        startTimer();
    } else {
        endGame("Only " + matches + " matches. You broke the chain!");
    }

    document.getElementById("guessInput").value = "";
    document.getElementById("suggestions").innerHTML = "";
}

function displayCurrent(){
    document.getElementById("currentPlayer").innerHTML =
        "<strong>" + currentPlayer.Player + "</strong><br>" +
        currentPlayer.Pos + " | " +
        currentPlayer.Team + " | Round " +
        currentPlayer.Round + " Pick " +
        currentPlayer.Pick + " | " +
        currentPlayer.Year + " | " +
        currentPlayer.College;

    document.getElementById("streak").innerText = "Chain Length: " + streak;
}

function endGame(message){
    clearInterval(timerInterval);
    document.getElementById("gameOver").innerText = message;

    if(mode === "rookie" && streak > bestRookie){
        bestRookie = streak;
        localStorage.setItem("bestRookie", bestRookie);
    }

    if(mode === "allpro" && streak > bestAllPro){
        bestAllPro = streak;
        localStorage.setItem("bestAllPro", bestAllPro);
    }

    updateLeaderboard();
}

function updateLeaderboard(){
    document.getElementById("leaderboard").innerHTML =
        "Rookie Mode: " + bestRookie + "<br>" +
        "All-Pro Mode: " + bestAllPro;
}
</script>

</body>
</html>
